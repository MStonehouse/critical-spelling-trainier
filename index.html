<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelling Recall Trainer</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1e222b;--text:#f3f5f7;--muted:#9ca6b2;--accent:#79a9ff;--good:#63d28b;--bad:#ff7a7a;--border:#2b313c}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,#0d0f13,#11151b);color:var(--text);min-height:100vh}.wrap{max-width:1160px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 6px}.sub{color:var(--muted);margin:0}.pill{border:1px solid var(--border);background:var(--panel);padding:8px 12px;border-radius:999px;color:var(--muted);white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1.2fr) 290px;gap:18px}.card{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.24)}.main{padding:28px;min-height:520px;display:flex;flex-direction:column}.side{padding:18px}.word-stage{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:220px}.word{font-size:clamp(1.82rem,5.6vw,4rem);font-weight:800;letter-spacing:.02em;word-break:break-word}.hidden-word{font-size:1.1rem;color:var(--muted)}.input-row{display:flex;gap:10px}input[type=text]{width:100%;font-size:1.35rem;padding:15px 16px;border-radius:12px;border:1px solid var(--border);background:#0f1319;color:var(--text);outline:none}input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(121,169,255,.15)}button{border:0;border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#0c1420}button.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}button.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.feedback{min-height:78px;padding-top:14px}.correct{color:var(--good);font-weight:700}.wrong{color:var(--bad);font-weight:700}.diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.05rem;line-height:1.6}.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px}.stat b{display:block;font-size:1.35rem}.stat span{color:var(--muted);font-size:.82rem}label{display:block;color:var(--muted);font-size:.88rem;margin:14px 0 6px}select,input[type=range]{width:100%}select{background:#0f1319;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}.range-line{display:flex;justify-content:space-between;color:var(--muted);font-size:.82rem}.small{font-size:.83rem;color:var(--muted)}.hr{height:1px;background:var(--border);margin:18px 0}.weak-list{max-height:170px;overflow:auto;font-size:.9rem}.weak-item{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05)}.footer-note{margin-top:12px;color:var(--muted);font-size:.8rem}@media(max-width:760px){.grid{grid-template-columns:1fr}.side{order:-1}.top{flex-direction:column}.main{min-height:430px}}
</style></head><body><div class="wrap"><div class="top"><div><h1>Spelling Recall Trainer</h1><p class="sub">See it. Hold it. Type it. Missed words return more often.</p></div><div class="pill"><span id="libraryCount"></span> words</div></div><div class="grid"><section class="card main"><div class="word-stage"><div><div id="word" class="word">Press Start</div><div id="cue" class="hidden-word"></div></div></div><div class="input-row"><input id="answer" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the word from memory…" disabled><button id="submit" disabled>Submit</button></div><div id="feedback" class="feedback"></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="start">Start Session</button><button id="skip" class="secondary" disabled>Skip</button><button id="resetStats" class="ghost">Reset Stats</button></div></section><aside class="card side"><div class="stat-grid"><div class="stat"><b id="accuracy">—</b><span>First-try accuracy</span></div><div class="stat"><b id="streak">0</b><span>Current streak</span></div><div class="stat"><b id="attempts">0</b><span>Words attempted</span></div><div class="stat"><b id="best">0</b><span>Best streak</span></div></div><label for="displayTime">Display time</label><input id="displayTime" type="range" min="300" max="2500" step="100" value="1100"><div class="range-line"><span>0.3 s</span><span id="displayTimeValue">1.1 s</span><span>2.5 s</span></div><label for="libraryMode">Vocabulary library</label><select id="libraryMode"><option value="mixed" selected>Mixed</option><option value="common">Commonly Misspelled</option><option value="dispatcher">Dispatcher Vocabulary</option></select><label for="mode">Word mix</label><select id="mode"><option value="mixed">Mixed</option><option value="weak">Weak words</option><option value="new">Mostly new</option></select><label for="difficulty">Difficulty</label><select id="difficulty"><option value="all">All</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select><label for="length">Word length</label><select id="length"><option value="all">All lengths</option><option value="short">4–7 letters</option><option value="medium">8–11 letters</option><option value="long">12+ letters</option></select><div class="hr"></div><div style="display:flex;justify-content:space-between;align-items:center"><strong>Weak words</strong><span class="small">miss count</span></div><div id="weakList" class="weak-list small">No misses yet.</div><div class="footer-note">Stats are saved locally in your browser.</div></aside></div></div>
<script>
const RAW=`accommodate accommodation achieve acquaintance acquire across address aggressive amateur apparent appearance argument assassinate attendance awkward basically beginning believe bizarre business calendar category cemetery changeable colleague column committed committee comparative conscience conscientious conscious consensus convenient correspondence definitely discipline disappear disappoint ecstasy embarrass embarrassment environment equipped exaggerate exceed existence experience familiar February fiery finally fluorescent foreign forty friend gauge government grammar guarantee harass harassment height hierarchy humorous immediately incidentally independent indispensable intelligence interrupt irresistible knowledge leisure liaison library license maintenance maneuver millennium miniature mischievous misspell necessary noticeable occasion occasionally occurrence occurred parallel parliament perseverance personnel possession preferred privilege pronunciation publicly questionnaire receive recommend recommendation referred relevant restaurant rhythm schedule separate siege similar sincerely successful supersede surprise surveillance threshold tomorrow truly twelfth unnecessary until vacuum vehicle weird Wednesday withhold writing absence acceptable accessible accidentally accomplish acknowledge acquiesce advice advise affect effect allotted already altogether analyze annual anonymous anxious apologize arctic argumentative assistant athletic authoritative available beautiful benefited boundary broccoli bureaucracy businesses Caribbean ceiling challenge changing chauffeur chief choir colonel commemorate commercial commission comparatively conceive congratulations consistent controversy coolly courteous criticize curiosity deceive decision deductible dependent describe desperate develop dilemma dining disastrous drunkenness eligible eminent exhilarate extraordinary facsimile fascinating favourite finalize forfeit fulfill generally grateful grammarian happened heir hindrance honorary hypocrisy ignorance immediate indict inoculate installment interference interpretation jewelry judgment kernel laboratory leisurely lieutenant loneliness luxury manageable medieval memento minuscule mortgage municipal neighbour niece ninety noticeably obedience omission opportunity parallelism pastime permanent permissible persistent plagiarism playwright possess precede prejudice principal principle proceed professor propaganda publicity queue receipt recede reference religious resistance ridiculous sacrilegious seize sheriff similarity stationary stationery subtle succeed sufficient temporary tendency therefore thorough through tomatoes transferred tragedy unanimous vacancy vicious villain weather whether wherever weirdly welfare wholly yield zealous accumulate adaptable admissible advantageous allegiance ambiguous analysis anniversary apparently arithmetic artificial beneficial candidate cancellation capacity career cautious civilian coincidence commencement competitive complaint conceivable convenience courtesy declaration deficiency deliberate description desirable difference disease efficient emergency equivalent essential explanation familiarity financial frequently governmental grievance guidance incident influence initially insurance interruption judicial legitimate miscellaneous negligence official omitted operator particular perception performance procedure professional repetition responsibility safety separation significant suspicious temperature transmission unfortunately vulnerable apparatus appliance auxiliary battery circuit collision communication conductor construction defective equipment evacuation hazardous inspection intersection manufacturer mechanical residential response traffic utility warning witness accommodating acknowledgment bureaucratic commissioned congratulate consciousness corresponding desperately embarrassing environmental exaggerated guaranteed independence privileged questionnaires recommendations surveilled withdrawal`.split(/\s+/);
const DISPATCHER_RAW=`suspect assault assaulted assaulting victim witness weapon firearm knife threatening threat disturbance domestic burglary robbery theft shoplifting trespassing vandalism suspicious description whereabouts apprehended detained arrested fleeing pursuit altercation aggressive intoxicated impaired stalking complainant statement evidence officer patrol dispatch fire smoke flames burning explosion explosive evacuate evacuation extinguisher sprinkler alarm structure wildfire electrical hazard hazardous propane gasoline combustible hydrant firefighter rescue trapped collapse sparking unconscious consciousness breathing unresponsive responsive bleeding injured injury overdose seizure convulsion diabetic allergic reaction choking ambulance paramedic patient pedestrian fracture laceration dizziness fainted fainting pregnant contractions medication poisoning pulse airway resuscitation defibrillator collision motorcycle bicycle intersection highway roadway shoulder lane northbound southbound eastbound westbound passenger driver licence registration sedan pickup truck traffic blocked blocking hazards disabled rollover ditch crosswalk speeding reckless windshield apartment residence residential commercial building entrance exit alley alleyway avenue boulevard crescent drive place road street terrace trail upstairs downstairs inside outside behind beside approximately male female person individual adult youth elderly height weight clothing jacket hoodie sweater shirt pants shorts shoes hat backpack beard moustache glasses blonde brown black grey white red blue green distinctive tattoo scar caller calling reports reported states advises unknown uncertain continuous continuously currently previously location direction information telephone occupant owner employee neighbour security camera responding priority assistance`.split(/\s+/);
const COMMON_SET=new Set(RAW);
const DISPATCHER_SET=new Set(DISPATCHER_RAW);
const WORDS=[...new Set([...RAW,...DISPATCHER_RAW])].map(word=>{let s=1; if(/(.)\1/.test(word))s++; if(/ie|ei/.test(word))s++; if(/tion|sion|cian|ance|ence/.test(word))s++; if(word.length>=10)s++; if(word.length>=13)s++; return {word,difficulty:s>=5?'hard':s>=3?'medium':'easy',library:COMMON_SET.has(word)&&DISPATCHER_SET.has(word)?'both':DISPATCHER_SET.has(word)?'dispatcher':'common'}});
const $=s=>document.querySelector(s), elWord=$('#word'),elCue=$('#cue'),answer=$('#answer'),feedback=$('#feedback'),startBtn=$('#start'),submitBtn=$('#submit'),skipBtn=$('#skip'),displayTime=$('#displayTime'),displayTimeValue=$('#displayTimeValue'),mode=$('#mode'),difficulty=$('#difficulty'),lengthSel=$('#length'),libraryMode=$('#libraryMode'); let current=null,timer=null,awaiting=false; const defaults={attempts:0,correct:0,streak:0,best:0,misses:{},seen:{}}; let stats=JSON.parse(localStorage.getItem('spellingRecallStats')||'null')||structuredClone(defaults);
function save(){localStorage.setItem('spellingRecallStats',JSON.stringify(stats));renderStats()} function renderStats(){$('#attempts').textContent=stats.attempts;$('#streak').textContent=stats.streak;$('#best').textContent=stats.best;$('#accuracy').textContent=stats.attempts?Math.round(stats.correct/stats.attempts*100)+'%':'—';const rows=Object.entries(stats.misses).sort((a,b)=>b[1]-a[1]).slice(0,30);$('#weakList').innerHTML=rows.length?rows.map(([w,n])=>`<div class="weak-item"><span>${w}</span><span>${n}</span></div>`).join(''):'No misses yet.'}
function filt(){return WORDS.filter(x=>{const lib=libraryMode.value;if(lib==='common'&&!(x.library==='common'||x.library==='both'))return false;if(lib==='dispatcher'&&!(x.library==='dispatcher'||x.library==='both'))return false;if(difficulty.value!=='all'&&x.difficulty!==difficulty.value)return false;const n=x.word.length;if(lengthSel.value==='short'&&!(n>=4&&n<=7))return false;if(lengthSel.value==='medium'&&!(n>=8&&n<=11))return false;if(lengthSel.value==='long'&&n<12)return false;return true})}
function choose(){let pool=filt();if(!pool.length)pool=WORDS;let weighted=[];for(const x of pool){const miss=stats.misses[x.word]||0,seen=stats.seen[x.word]||0;let w=1;if(mode.value==='mixed')w=1+miss*4+(seen===0?2:0);if(mode.value==='weak')w=miss?3+miss*6:.2;if(mode.value==='new')w=seen===0?8:1/(1+seen);for(let i=0;i<Math.max(1,Math.min(30,Math.round(w*2)));i++)weighted.push(x)}return weighted[Math.floor(Math.random()*weighted.length)]}
function showNext(){clearTimeout(timer);current=choose();feedback.innerHTML='';answer.value='';answer.disabled=true;submitBtn.disabled=true;skipBtn.disabled=false;elCue.textContent='Memorize';elWord.textContent=current.word;stats.seen[current.word]=(stats.seen[current.word]||0)+1;save();timer=setTimeout(()=>{elWord.textContent='••••••';elCue.textContent='Type it from memory';answer.disabled=false;submitBtn.disabled=false;answer.focus();awaiting=true},+displayTime.value)}
function submit(){if(!awaiting||!current)return;const typed=answer.value.trim().toLowerCase(),target=current.word.toLowerCase();stats.attempts++;if(typed===target){stats.correct++;stats.streak++;stats.best=Math.max(stats.best,stats.streak);feedback.innerHTML=`<div class="correct">Correct — ${current.word}</div>`;save();awaiting=false;answer.disabled=true;submitBtn.disabled=true;setTimeout(showNext,650)}else{stats.streak=0;stats.misses[current.word]=(stats.misses[current.word]||0)+1;feedback.innerHTML=`<div class="wrong">Not quite.</div><div class="diff">You: ${typed}<br>Correct: <span class="correct">${current.word}</span></div><div class="small">Type the correct word once to continue.</div>`;save();awaiting='correction';answer.value='';answer.focus()}}
function handle(){if(awaiting==='correction'){if(answer.value.trim().toLowerCase()===current.word.toLowerCase()){feedback.innerHTML=`<div class="correct">Corrected — ${current.word}</div>`;awaiting=false;answer.disabled=true;submitBtn.disabled=true;setTimeout(showNext,650)}else{answer.value='';answer.focus()}}else submit()}
answer.addEventListener('keydown',e=>{if(e.key==='Enter')handle()});submitBtn.addEventListener('click',handle);startBtn.addEventListener('click',()=>{startBtn.textContent='Restart Session';showNext()});skipBtn.addEventListener('click',()=>{stats.streak=0;save();showNext()});$('#resetStats').addEventListener('click',()=>{if(confirm('Reset all saved spelling stats?')){stats=structuredClone(defaults);save()}});displayTime.addEventListener('input',()=>displayTimeValue.textContent=(displayTime.value/1000).toFixed(1)+' s');$('#libraryCount').textContent=WORDS.length;displayTimeValue.textContent=(displayTime.value/1000).toFixed(1)+' s';renderStats();
</script></body></html>
